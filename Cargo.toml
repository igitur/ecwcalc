[package]
name = "ecw-vizia"
version = "0.1.0"
edition = "2021"
description = "ECW Expression Calculator — vizia (immediate mode) port"
license = "MIT"

[dependencies]
vizia = "0.4"

[profile.release]
opt-level = "s"          # size over speed (calc doesn't need max perf)
lto = "thin"             # cross-crate dead-code elimination
codegen-units = 1        # maximizes LTO effect
panic = "abort"          # drop Rust unwind tables
strip = true             # remove symbol table + debug info
