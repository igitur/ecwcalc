name: CI

on:
  push:
    branches: [main, vizia-port]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps (winit/glutin/skia)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb1-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libfreetype-dev libfontconfig-dev

      - name: Build
        run: cargo build

      - name: Unit tests
        run: cargo test --lib

      # Differential battery vs the FPC reference. The FPC CLI (byte-exact vs
      # the original) lives on `main`; fetch it there and compile with fpc.
      - name: Install FPC (oracle)
        run: sudo apt-get install -y fpc

      - name: Build FPC oracle from main
        run: |
          git clone --depth 1 --branch main \
            https://github.com/igitur/ecwcalc.git /tmp/ecw-oracle
          cd /tmp/ecw-oracle && fpc -O3 ecw.pas

      - name: Differential battery vs FPC oracle
        run: ECW_FPC_BIN=/tmp/ecw-oracle/ecw cargo test --test battery
