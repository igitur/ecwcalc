name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & test (Ubuntu, FPC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FPC + Lazarus
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc lazarus

      - name: Build CLI (ecw.pas)
        run: fpc -O2 ecw.pas

      - name: Build GUI (Lazarus)
        run: lazbuild --quiet gui/ecwcalc.lpi

      - name: Battery (regression vs reference batteries)
        run: python3 tests/battery.py ./ecw
