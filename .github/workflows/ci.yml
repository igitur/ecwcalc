name: CI

on:
  push:
    branches: [main, go-port]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Linux build deps (IUP/GTK3)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test .

      # Differential battery vs the FPC reference. The FPC CLI (byte-exact vs
      # the original) lives on `main`; fetch it there and compile with fpc.
      - name: Install FPC (oracle)
        run: sudo apt-get install -y fpc

      - name: Build FPC oracle from main
        run: |
          git clone --depth 1 --branch main \
            https://github.com/igitur/ecwcalc.git /tmp/ecw-oracle
          cd /tmp/ecw-oracle && fpc -O3 ecw.pas

      - name: Differential battery vs FPC oracle
        run: ECW_FPC_BIN=/tmp/ecw-oracle/ecw go test -v -run Battery .
