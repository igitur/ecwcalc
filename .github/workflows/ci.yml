name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & test (Ubuntu, FPC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FPC + Lazarus
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc lazarus

      - name: Build CLI (ec.lpi)
        run: ./build.sh cli

      - name: Build GUI (ecw.lpi)
        run: ./build.sh gui

      - name: Battery (regression vs reference batteries)
        run: python3 tests/battery.py ./ec
