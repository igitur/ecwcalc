name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
            exe: ''
            battery: true
          - os: windows-latest
            suffix: windows-x64
            exe: '.exe'
            battery: true
          # macos-latest runners are arm64: FPC's 80-bit Extended falls back
          # to Double there, so the byte-exact differential battery is
          # x86_64-only (Ubuntu + Windows); macOS gets build + smoke tests.
          - os: macos-latest
            suffix: macos-arm64
            exe: ''
            battery: false

    steps:
      - uses: actions/checkout@v4

      # ---------------- toolchains ----------------
      - name: Install FPC + Lazarus (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc lazarus \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb1-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Install FPC + Lazarus (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install fpc
          brew install --cask lazarus
          # the cask installs lazbuild inside the app bundle; expose it
          echo "/Applications/Lazarus.app/Contents/MacOS" >> "$GITHUB_PATH"
          which fpc lazbuild || true

      - name: Install FPC + Lazarus (Windows, choco bundle)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install lazarus --no-progress -y
          echo "C:\\lazarus" >> "$GITHUB_PATH"
          FPCVER=$(ls /c/lazarus/fpc | head -1)
          echo "C:\\lazarus\\fpc\\${FPCVER}\\bin\\x86_64-win64" >> "$GITHUB_PATH"
          which fpc lazbuild || true

      - uses: dtolnay/rust-toolchain@stable

      # ---------------- build: FPC CLI ----------------
      - name: Build FPC CLI
        run: fpc -O3 ecw.pas

      - name: Smoke-test CLI
        shell: bash
        run: |
          test "$(./ecw${{ matrix.exe }} '2+3*4')" = "14"
          test "$(./ecw${{ matrix.exe }} '2**1000')" = "1.07150860718627E+0301"
          test "$(./ecw${{ matrix.exe }} '0xFFFFFFFF')" = "-1"
          test "$(./ecw${{ matrix.exe }} --unsigned '0xFFFFFFFF')" = "4294967295"

      # ---------------- build: Lazarus GUI ----------------
      - name: Build Lazarus GUI
        run: lazbuild gui/ecwcalc.lpi

      # ---------------- build: vizia (Rust) ----------------
      - name: Build vizia GUI
        working-directory: vizia
        run: cargo build --release

      - name: Rust unit tests
        working-directory: vizia
        run: cargo test --lib

      - name: Differential battery vs FPC CLI (x86_64 only)
        if: matrix.battery
        working-directory: vizia
        env:
          ECW_FPC_BIN: ${{ github.workspace }}/ecw${{ matrix.exe }}
        run: cargo test --test battery

      # ---------------- stage + upload ----------------
      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p dist
          cp ecw${{ matrix.exe }}        dist/ecw-${{ matrix.suffix }}${{ matrix.exe }}
          cp gui/ecwcalc${{ matrix.exe }} dist/ecwcalc-${{ matrix.suffix }}${{ matrix.exe }}
          cp vizia/target/release/ecw-vizia${{ matrix.exe }} dist/ecw-vizia-${{ matrix.suffix }}${{ matrix.exe }}

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List staged binaries
        run: ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
