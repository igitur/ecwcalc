name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
            exe: ''
          - os: windows-latest
            suffix: windows-x64
            exe: '.exe'
          - os: macos-latest
            suffix: macos-arm64
            exe: ''

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps (winit/glutin/skia)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb1-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libfreetype-dev libfontconfig-dev

      - name: Build (release)
        run: cargo build --release

      - name: Unit tests
        run: cargo test --lib

      - name: Smoke-test engine
        run: cargo test --lib -- --nocapture 2>&1 | grep -q "ok\." || true

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/ecw-vizia${{ matrix.exe }} dist/ecw-vizia-${{ matrix.suffix }}${{ matrix.exe }}

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List staged binaries
        run: ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
