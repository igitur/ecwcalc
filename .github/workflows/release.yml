name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: linux-x64
            target: ''
            laz: ''
            exe: ''
            extra: ''
          - suffix: windows-x64
            target: '-Twin64 -Px86_64'
            laz: '--os=win64 --cpu=x86_64 --ws=win32'
            exe: '.exe'
            extra: 'fp-units-win-rtl-3.2.2 fp-units-win-fcl-3.2.2 fp-units-win-gfx-3.2.2 fp-units-win-net-3.2.2 fp-units-win-db-3.2.2 fp-units-win-misc-3.2.2'
    steps:
      - uses: actions/checkout@v4

      - name: Install FPC + Lazarus
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc lazarus fpc-source ${{ matrix.extra }}

      - name: Build cross-compiler (windows only)
        if: matrix.suffix == 'windows-x64'
        run: |
          curl -sL --retry 5 --retry-all-errors --retry-delay 5 --max-time 900 \
            "https://sourceforge.net/projects/freepascal/files/Source/3.2.2/fpc-3.2.2.source.tar.gz/download" \
            -o /tmp/fpc-src.tar.gz
          tar xzf /tmp/fpc-src.tar.gz -C /tmp
          cd /tmp/fpc-3.2.2
          sudo make crossinstall OS_TARGET=win64 CPU_TARGET=x86_64

      - name: Build CLI (release)
        run: |
          mkdir -p dist
          fpc -O2 -Xs ${{ matrix.target }} -odist/ecw-fpc-${{ matrix.suffix }}${{ matrix.exe }} ecw.pas

      - name: Build GUI (lazbuild)
        run: |
          mkdir -p dist
          lazbuild --quiet ${{ matrix.laz }} gui/ecwcalc.lpi
          cp gui/ecwcalc${{ matrix.exe }} dist/ecw-fpc-gui-${{ matrix.suffix }}${{ matrix.exe }}
          strip dist/ecw-fpc-gui-${{ matrix.suffix }}${{ matrix.exe }}

      - name: Battery (regression)
        if: matrix.suffix == 'linux-x64'
        run: python3 tests/battery.py dist/ecw-fpc-linux-x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List staged binaries
        run: ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          overwrite_files: true
